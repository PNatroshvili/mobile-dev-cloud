name: Mobile Workspace

on:
  workflow_dispatch:
    inputs:
      mobile_repo:
        description: Mobile repository (owner/name)
        required: true
        type: string
      mobile_ref:
        description: Mobile branch or commit
        required: true
        type: string
      api_repo:
        description: Backend repository (owner/name)
        required: true
        type: string
      api_ref:
        description: Backend branch or commit
        required: true
        type: string
      session_minutes:
        description: Workspace lifetime (5-60 minutes)
        required: false
        default: '30'
        type: string
      android_emulator:
        description: Run Android emulator capability preflight
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CLOUDFLARED_VERSION: 2026.10.0
      CLOUDFLARED_SHA256: d33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db
    steps:
      - name: Create scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.MOBILE_DEV_CLOUD_APP_ID }}
          private-key: ${{ secrets.MOBILE_DEV_CLOUD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout mobile app
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.mobile_repo }}
          ref: ${{ inputs.mobile_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: mobile

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.api_repo }}
          ref: ${{ inputs.api_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: api

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            api/package-lock.json

      - name: Android emulator capability preflight
        if: ${{ inputs.android_emulator }}
        run: |
          echo "Stage: Android emulator preflight"
          set -euo pipefail
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          echo "Architecture: $RUNNER_ARCH"
          if [ -e /dev/kvm ]; then
            echo "/dev/kvm: present"
            ls -l /dev/kvm
          else
            echo "/dev/kvm: unavailable"
          fi
          echo "CPU virtualization flags:"
          grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u | tr '\n' ' ' || true
          echo
          echo "Android emulator preflight completed. Emulator installation/boot is intentionally not enabled yet."

      - name: Setup Android emulator
        if: ${{ inputs.android_emulator }}
        run: |
          echo "Stage: Setting up Android emulator"
          set -euo pipefail

          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_SDK_ROOT
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"

          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"

          printf "no\n" | avdmanager create avd \
            --name mobile-dev-cloud \
            --package "system-images;android-35;google_apis;x86_64" \
            --force
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/mobile-dev-cloud.ini"

          echo "hw.device.name=pixel_6" >> "$HOME/.android/avd/mobile-dev-cloud.avd/config.ini"
          echo "hw.ramSize=2048" >> "$HOME/.android/avd/mobile-dev-cloud.avd/config.ini"

          emulator -list-avds
          emulator -avd mobile-dev-cloud \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on > /tmp/android-emulator.log 2>&1 &
          echo $! > /tmp/android-emulator.pid

          adb start-server
          adb wait-for-device

          for i in $(seq 1 90); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$booted" = "1" ] && break
            sleep 2
          done

          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82 || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0

          echo "Android emulator booted successfully." >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned Cloudflare Tunnel
        run: |
          set -euo pipefail
          url="https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          curl -fsSL "$url" -o /tmp/cloudflared
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared" | sha256sum -c -
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start backend
        working-directory: api
        run: |
          echo "Stage: Starting backend"
          echo "Workspace mobile repo: ${{ inputs.mobile_repo }}"
          echo "Workspace mobile ref: ${{ inputs.mobile_ref }}"
          echo "Workspace API repo: ${{ inputs.api_repo }}"
          echo "Workspace API ref: ${{ inputs.api_ref }}"
          echo "Workspace minutes: ${{ inputs.session_minutes }}"
          if [ ! -f package.json ]; then echo 'Backend repository is not accessible or is invalid.'; exit 1; fi
          docker compose up -d postgres redis minio mailpit
          npm ci
          cat > .env <<'EOF'
          NODE_ENV=development
          PORT=3000
          HOST=0.0.0.0
          CORS_ORIGINS=https://placeholder.invalid
          DATABASE_URL=postgres://lukma:lukma_dev@127.0.0.1:5432/lukma
          REDIS_URL=redis://127.0.0.1:6379
          S3_ENDPOINT=http://127.0.0.1:9000
          S3_REGION=us-east-1
          S3_BUCKET=lukma-dev
          S3_ACCESS_KEY=lukma_dev
          S3_SECRET_KEY=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-s3
          JWT_ACCESS_SECRET=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-access
          JWT_REFRESH_SECRET=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-refresh
          SMTP_HOST=127.0.0.1
          SMTP_PORT=1025
          SMTP_SECURE=false
          SMTP_FROM=noreply@lukma.local
          EOF
          npm run db:migrate
          nohup npm run start:dev > /tmp/lukma-api.log 2>&1 &
          echo $! > /tmp/lukma-api.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health/ready && exit 0; sleep 2; done
          cat /tmp/lukma-api.log
          exit 1

      - name: Start API tunnel
        run: |
          echo "Stage: Creating API tunnel"
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:3000 > /tmp/api-tunnel.log 2>&1 &
          echo $! > /tmp/api-tunnel.pid
          for i in $(seq 1 60); do API_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/api-tunnel.log | head -1 || true); [ -n "$API_URL" ] && break; sleep 2; done
          test -n "${API_URL:-}" || { cat /tmp/api-tunnel.log; exit 1; }
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "API: $API_URL"

      - name: Start Expo web
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}
        run: |
          echo "Stage: Starting Expo Web"
          if [ ! -f package.json ]; then echo 'Mobile repository is not accessible or is invalid.'; exit 1; fi
          npm ci
          nohup npx expo start --web --port 8081 --non-interactive > /tmp/expo.log 2>&1 &
          echo $! > /tmp/expo.pid
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8081 >/dev/null 2>&1 && exit 0; sleep 2; done
          cat /tmp/expo.log
          exit 1

      - name: Start preview tunnel
        id: preview
        run: |
          echo "Stage: Creating preview tunnel"
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8081 > /tmp/web-tunnel.log 2>&1 &
          echo $! > /tmp/web-tunnel.pid
          for i in $(seq 1 60); do WEB_URL=$(grep -oE 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/web-tunnel.log | head -1 || true); [ -n "$WEB_URL" ] && break; sleep 2; done
          test -n "${WEB_URL:-}" || { cat /tmp/web-tunnel.log; exit 1; }
          echo "url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "## Mobile Dev Cloud" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview: $WEB_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "API: $API_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Align API CORS with preview
        working-directory: api
        run: |
          echo "Stage: Aligning API CORS"
          sed -i "s|^CORS_ORIGINS=.*|CORS_ORIGINS=$WEB_URL|" .env
          if [ -f /tmp/lukma-api.pid ]; then kill "$(cat /tmp/lukma-api.pid)" || true; fi
          nohup npm run start:dev > /tmp/lukma-api.log 2>&1 &
          echo $! > /tmp/lukma-api.pid
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health/ready && exit 0; sleep 2; done
          cat /tmp/lukma-api.log
          exit 1

      - name: Verify runtime endpoints
        run: |
          echo "Stage: Verifying runtime"
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/health/ready >/dev/null
          curl -fsSI --max-time 15 "$WEB_URL" >/dev/null
          echo "Runtime endpoint checks passed." >> "$GITHUB_STEP_SUMMARY"

      - name: Keep workspace alive
        run: |
          echo "Stage: Workspace ready"
          MINUTES=${{ inputs.session_minutes }}
          case "$MINUTES" in ''|*[!0-9]*) MINUTES=30;; esac
          [ "$MINUTES" -ge 5 ] && [ "$MINUTES" -le 60 ] || MINUTES=30
          echo "Preview: ${{ steps.preview.outputs.url }}"
          echo "Workspace ready: ${{ steps.preview.outputs.url }}"
          sleep $((MINUTES * 60))
      - name: Collect runtime diagnostics
        if: always()
        run: |
          echo "### Runtime diagnostics" >> "$GITHUB_STEP_SUMMARY"
          for file in /tmp/lukma-api.log /tmp/api-tunnel.log /tmp/expo.log /tmp/web-tunnel.log; do
            if [ -f "$file" ]; then
              echo "<details><summary>$(basename "$file")</summary>" >> "$GITHUB_STEP_SUMMARY"
              echo '````text`' >> "$GITHUB_STEP_SUMMARY"
              tail -n 40 "$file" >> "$GITHUB_STEP_SUMMARY" || true
              echo '`````' >> "$GITHUB_STEP_SUMMARY"
              echo "</details>" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Cleanup workspace
        if: always()
        working-directory: api
        run: |
          if [ -f /tmp/web-tunnel.pid ]; then kill "$(cat /tmp/web-tunnel.pid)" || true; fi
          if [ -f /tmp/api-tunnel.pid ]; then kill "$(cat /tmp/api-tunnel.pid)" || true; fi
          if [ -f /tmp/expo.pid ]; then kill "$(cat /tmp/expo.pid)" || true; fi
          if [ -f /tmp/lukma-api.pid ]; then kill "$(cat /tmp/lukma-api.pid)" || true; fi
          docker compose down --volumes --remove-orphans || true
