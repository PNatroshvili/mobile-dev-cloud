name: Android Emulator E2E

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-emulator-e2e.yml"

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm
          ls -l /dev/kvm
          grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u

      - name: Boot Android emulator from installed runner image
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          echo "Installed system images:"
          find "$ANDROID_SDK_ROOT/system-images" -maxdepth 3 -type d -name 'x86_64' -print 2>/dev/null || true
          IMAGE="$(find "$ANDROID_SDK_ROOT/system-images" -maxdepth 3 -type d -name 'x86_64' -print -quit 2>/dev/null || true)"
          test -n "$IMAGE"
          PACKAGE="system-images;android-35;google_apis;x86_64"
          case "$IMAGE" in
            *android-35*google_apis*x86_64) PACKAGE="system-images;android-35;google_apis;x86_64" ;;
            *) echo "Using installed image at $IMAGE" ;;
          esac
          printf 'no\n' | avdmanager create avd --name mobile-dev-cloud-e2e --package "$PACKAGE" --force
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/mobile-dev-cloud-e2e.ini"
          emulator -avd mobile-dev-cloud-e2e -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -accel on > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/emulator.pid
          adb start-server
          adb wait-for-device
          for i in $(seq 1 120); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            [ "$booted" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell getprop ro.build.version.release
          adb shell wm size
          adb exec-out screencap -p > /tmp/android-emulator.png
          test -s /tmp/android-emulator.png
          echo "Android emulator boot + ADB + screenshot verification passed."

      - name: Diagnostics
        if: always()
        run: |
          if [ -f /tmp/emulator.log ]; then tail -n 80 /tmp/emulator.log; fi
          if [ -f /tmp/emulator.pid ]; then kill "$(cat /tmp/emulator.pid)" || true; fi
