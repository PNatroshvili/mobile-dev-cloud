name: Android Emulator E2E

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/android-emulator-e2e.yml"

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check KVM
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          grep -Eo 'vmx|svm' /proc/cpuinfo | sort -u

      - name: Install image and boot Android emulator
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          yes | sdkmanager --licenses >/dev/null || true
          timeout 8m sdkmanager "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
          printf 'no\n' | timeout 60s avdmanager create avd --name mobile-dev-cloud-e2e --package "system-images;android-35;google_apis;x86_64" --force
          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/mobile-dev-cloud-e2e.ini"
          emulator -avd mobile-dev-cloud-e2e -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data -gpu swiftshader_indirect -accel on > /tmp/emulator.log 2>&1 &
          echo $! > /tmp/android-emulator.pid
          adb start-server
          timeout 30s adb wait-for-device
          for i in $(seq 1 120); do
            booted="$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$booted" = "1" ]; then break; fi
            if [ "$((i % 10))" = "0" ]; then tail -n 20 /tmp/emulator.log || true; fi
            sleep 2
          done
          if [ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" != "1" ]; then
            echo "Android emulator did not finish booting."
            tail -n 120 /tmp/emulator.log || true
            exit 1
          fi
          adb shell getprop ro.build.version.release
          adb shell wm size
          adb exec-out screencap -p > /tmp/android-emulator.png
          test -s /tmp/android-emulator.png
          echo "Android emulator boot + ADB + screenshot verification passed."

      - name: Diagnostics
        if: always()
        run: |
          if [ -f /tmp/emulator.log ]; then tail -n 80 /tmp/emulator.log; fi
          if [ -f /tmp/emulator.pid ]; then kill "$(cat /tmp/emulator.pid)" || true; fi
