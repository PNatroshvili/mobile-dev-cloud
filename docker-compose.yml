services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mobile_dev_cloud
      POSTGRES_USER: mobile_dev_cloud
      POSTGRES_PASSWORD: local_only_change_me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  redis_data:
